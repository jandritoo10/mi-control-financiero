<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><meta name="description" content="Control personal de ingresos, gastos, presupuestos y ahorro"><link rel="manifest" href="manifest.webmanifest"><title>Mi Control Financiero</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#0b1020;color:#f5f7ff}*{box-sizing:border-box}body{margin:0}main{max-width:650px;margin:auto;padding:22px 16px 100px}h1{font-size:24px;margin:6px 0}h2{font-size:18px;margin:0 0 14px}.muted{color:#a8b1cb}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.card{background:#171e32;border:1px solid #29334e;border-radius:18px;padding:18px;margin-bottom:14px}.hero{background:linear-gradient(130deg,#293c75,#17264a)}.amount{font-size:30px;font-weight:800;margin:8px 0}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}.summary .card{margin:0}.green{color:#65e0ae}.red{color:#ff8f9e}.blue{color:#9dbbff}button,input,select{font:inherit}button{border:0;border-radius:12px;background:#668cff;color:#071126;font-weight:700;padding:12px 16px;cursor:pointer}button.secondary{background:#27334e;color:#e6edff}button.danger{background:#633042;color:#ffe4e9}.actions{display:flex;gap:8px;flex-wrap:wrap}input,select{width:100%;border:1px solid #394663;border-radius:12px;background:#10172a;color:#fff;padding:12px;margin:6px 0 14px}label{font-size:13px;color:#c6d0e8}nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#11192b;border-top:1px solid #29334e;padding:9px 4px max(10px,env(safe-area-inset-bottom))}nav>div{width:min(650px,100%);display:grid;grid-template-columns:repeat(5,1fr);gap:4px}nav button{background:transparent;color:#b8c3df;font-size:11px;padding:9px 2px}nav button.active{background:#293b68;color:#fff}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.item{padding:12px 0;border-bottom:1px solid #2b3550}.item:last-child{border:0}.small{font-size:12px}.bar{height:9px;border-radius:20px;background:#303c58;overflow:hidden;margin:9px 0}.fill{height:100%;background:#789bff}.hidden{display:none!important}.empty{text-align:center;color:#a8b1cb;padding:22px 5px}.section{margin:22px 0 12px}.notice{font-size:12px;color:#c5cde2;line-height:1.6}.pill{font-size:12px;border-radius:30px;padding:4px 9px;background:#293b5c}.dialog{position:fixed;inset:0;background:#050814e8;display:grid;place-items:center;padding:18px;z-index:10}.dialog .card{width:min(440px,100%);max-height:90vh;overflow:auto}canvas{width:100%;height:200px}a{color:#a8c2ff}
</style></head><body><main><header class="top"><div><div class="muted small">TU ECONOMÍA PERSONAL</div><h1>Mi Control Financiero</h1></div><span style="font-size:28px">💶</span></header><div id="view"></div></main><nav><div id="tabs"></div></nav><div id="modal" class="dialog hidden"><div class="card" id="modalBody"></div></div><script>
const KEY='mcf-v1';let state={transactions:[],budgets:{},goals:[]},tab='inicio',month=new Date().toISOString().slice(0,7);const cats=['Alimentación','Transporte','Vivienda','Facturas','Ocio','Salud','Compras','Suscripciones','Otros'];const euro=n=>Number(n||0).toLocaleString('es-ES',{style:'currency',currency:'EUR'});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function load(){try{let v=JSON.parse(localStorage.getItem(KEY));if(v&&Array.isArray(v.transactions)&&Array.isArray(v.goals))state=v}catch(e){}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}load();function monthly(){return state.transactions.filter(t=>t.date.startsWith(month))}function totals(){let t=monthly();return {income:t.filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0),expense:t.filter(x=>x.type==='expense').reduce((s,x)=>s+x.amount,0)}}function spent(cat){return monthly().filter(x=>x.type==='expense'&&x.category===cat).reduce((s,x)=>s+x.amount,0)}function bar(a,b){return `<div class="bar"><div class="fill" style="width:${Math.min(100,b?100*a/b:0)}%"></div></div>`}function card(title,value,cl=''){return `<div class="card"><div class="muted small">${title}</div><div class="amount ${cl}" style="font-size:22px">${euro(value)}</div></div>`}function monthInput(){return `<label>Mes seleccionado<input type="month" id="month" value="${month}"></label>`}function render(){let t=totals(),list=monthly().sort((a,b)=>b.date.localeCompare(a.date));document.getElementById('tabs').innerHTML=[['inicio','⌂','Inicio'],['movimientos','⇄','Movimientos'],['presupuestos','◉','Presupuestos'],['ahorro','◇','Ahorro'],['estadisticas','▥','Estadísticas']].map(([id,icon,name])=>`<button class="${tab===id?'active':''}" data-tab="${id}"><div style="font-size:21px">${icon}</div>${name}</button>`).join('');let html='';if(tab==='inicio'){html=`<div class="card hero"><div class="muted">Balance del mes</div><div class="amount">${euro(t.income-t.expense)}</div><div class="small">Ingresos menos gastos de ${month}</div></div><div class="summary">${card('Ingresos',t.income,'green')}${card('Gastos',t.expense,'red')}</div><div class="section actions"><button data-add="expense">+ Gasto</button><button class="secondary" data-add="income">+ Ingreso</button></div>${monthInput()}<h2 class="section">Últimos movimientos</h2>${transactionRows(list.slice(0,5))}<div class="card notice">Tus datos se guardan en este navegador. Exporta una copia regularmente: borrar los datos del navegador puede eliminarlos.</div>`}if(tab==='movimientos'){html=`<div class="actions"><button data-add="expense">+ Gasto</button><button data-add="income" class="secondary">+ Ingreso</button></div><div class="section">${monthInput()}</div><h2>Movimientos</h2>${transactionRows(list)}<div class="card"><h2>Copias de seguridad</h2><div class="actions"><button id="export">Exportar JSON</button><button class="secondary" id="importBtn">Importar JSON</button><input type="file" id="importFile" accept="application/json,.json" class="hidden"></div><p class="notice">El archivo exportado contiene tus datos financieros sin cifrar. Guárdalo en un lugar seguro.</p></div>`}if(tab==='presupuestos'){html=`${monthInput()}<h2 class="section">Límites mensuales</h2><div class="card">${cats.map(c=>{let b=Number(state.budgets[c]||0),a=spent(c);return `<div class="item"><div class="row"><strong>${c}</strong><button class="secondary small" data-budget="${c}">Editar</button></div><div class="small muted">${euro(a)} gastados ${b?'de '+euro(b):'· sin límite'}</div>${b?bar(a,b):''}${b&&a>b?'<span class="red small">Presupuesto superado</span>':''}</div>`}).join('')}</div>`}if(tab==='ahorro'){html=`<div class="card"><h2>Objetivos de ahorro</h2><p class="muted">Registra cuánto llevas ahorrado para cada objetivo. Estos importes son independientes del balance mensual.</p><button id="addGoal">+ Nuevo objetivo</button></div>${state.goals.length?state.goals.map(g=>`<div class="card"><div class="row"><strong>${esc(g.name)}</strong><button class="secondary" data-goal="${g.id}">Editar</button></div><div class="amount blue" style="font-size:22px">${euro(g.saved)} <span class="small muted">/ ${euro(g.target)}</span></div>${bar(g.saved,g.target)}</div>`).join(''):'<div class="empty">Todavía no tienes objetivos de ahorro.</div>'}`}if(tab==='estadisticas'){let expenses=cats.map(c=>({name:c,value:spent(c)})).filter(x=>x.value>0).sort((a,b)=>b.value-a.value);html=`${monthInput()}<div class="summary section">${card('Ingresos',t.income,'green')}${card('Gastos',t.expense,'red')}</div>${card('Ahorro neto del mes',t.income-t.expense,t.income-t.expense>=0?'green':'red')}<div class="card"><h2>Gastos por categoría</h2>${expenses.length?expenses.map(x=>`<div class="item"><div class="row"><span>${x.name}</span><strong>${euro(x.value)}</strong></div>${bar(x.value,t.expense)}</div>`).join(''):'<div class="empty">Registra gastos para ver estadísticas.</div>'}</div>`}document.getElementById('view').innerHTML=html;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>transactionForm(b.dataset.add));document.getElementById('month')?.addEventListener('change',e=>{month=e.target.value;render()});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('¿Eliminar este movimiento?')){state.transactions=state.transactions.filter(x=>x.id!==b.dataset.delete);save();render()}});document.querySelectorAll('[data-budget]').forEach(b=>b.onclick=()=>budgetForm(b.dataset.budget));document.querySelectorAll('[data-goal]').forEach(b=>b.onclick=()=>goalForm(b.dataset.goal));document.getElementById('addGoal')?.addEventListener('click',()=>goalForm());document.getElementById('export')?.addEventListener('click',exportData);document.getElementById('importBtn')?.addEventListener('click',()=>document.getElementById('importFile').click());document.getElementById('importFile')?.addEventListener('change',importData)}function transactionRows(arr){return arr.length?`<div class="card">${arr.map(x=>`<div class="item row"><div><strong>${esc(x.note||x.category)}</strong><div class="small muted">${esc(x.date)} · ${esc(x.category)}</div></div><div style="text-align:right"><strong class="${x.type==='income'?'green':'red'}">${x.type==='income'?'+':'−'}${euro(x.amount)}</strong><div><button class="secondary small" data-delete="${x.id}" style="padding:4px 9px;margin-top:6px">Eliminar</button></div></div></div>`).join('')}</div>`:'<div class="empty">No hay movimientos este mes.</div>'}function openModal(html,submit){let m=document.getElementById('modal');document.getElementById('modalBody').innerHTML=html+'<div class="actions"><button id="ok">Guardar</button><button id="cancel" class="secondary">Cancelar</button></div>';m.classList.remove('hidden');document.getElementById('cancel').onclick=closeModal;document.getElementById('ok').onclick=submit}function closeModal(){document.getElementById('modal').classList.add('hidden')}function transactionForm(type){openModal(`<h2>${type==='income'?'Nuevo ingreso':'Nuevo gasto'}</h2><label>Importe (€)<input id="amount" type="number" min="0.01" step="0.01" placeholder="0,00"></label><label>Concepto<input id="note" maxlength="90" placeholder="Ej. supermercado"></label><label>Categoría<select id="cat">${(type==='income'?['Nómina','Extra','Otros']:cats).map(c=>`<option>${c}</option>`).join('')}</select></label><label>Fecha<input id="date" type="date" value="${new Date().toLocaleDateString('en-CA')}"></label>`,()=>{let amount=Number(document.getElementById('amount').value),date=document.getElementById('date').value;if(!Number.isFinite(amount)||amount<=0||!/^\d{4}-\d{2}-\d{2}$/.test(date)){alert('Introduce un importe y una fecha válidos.');return}state.transactions.push({id:crypto.randomUUID(),type,amount,date,category:document.getElementById('cat').value,note:document.getElementById('note').value.trim()});save();closeModal();render()})}function budgetForm(cat){openModal(`<h2>Presupuesto: ${cat}</h2><label>Límite mensual (€). Pon 0 para quitarlo.<input id="budget" type="number" min="0" step="0.01" value="${state.budgets[cat]||0}"></label>`,()=>{let n=Number(document.getElementById('budget').value);if(!Number.isFinite(n)||n<0)return alert('Importe no válido');state.budgets[cat]=n;save();closeModal();render()})}function goalForm(id){let g=state.goals.find(x=>x.id===id)||{name:'',target:0,saved:0};openModal(`<h2>Objetivo de ahorro</h2><label>Nombre<input id="goalName" maxlength="70" value="${esc(g.name)}" placeholder="Ej. vacaciones"></label><label>Objetivo (€)<input id="goalTarget" type="number" min="0.01" step="0.01" value="${g.target||''}"></label><label>Ahorrado (€)<input id="goalSaved" type="number" min="0" step="0.01" value="${g.saved}"></label>`,()=>{let name=document.getElementById('goalName').value.trim(),target=Number(document.getElementById('goalTarget').value),saved=Number(document.getElementById('goalSaved').value);if(!name||!Number.isFinite(target)||target<=0||!Number.isFinite(saved)||saved<0)return alert('Revisa los datos');if(id)Object.assign(g,{name,target,saved});else state.goals.push({id:crypto.randomUUID(),name,target,saved});save();closeModal();render()})}function exportData(){let blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),data:state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mi-control-financiero-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}async function importData(e){let f=e.target.files[0];if(!f)return;try{if(f.size>5e6)throw Error('Archivo demasiado grande');let obj=JSON.parse(await f.text()),v=obj.data;if(!v||!Array.isArray(v.transactions)||!Array.isArray(v.goals)||typeof v.budgets!=='object'||!v.budgets)throw Error('Formato no válido');if(!v.transactions.every(x=>['income','expense'].includes(x.type)&&Number.isFinite(x.amount)&&x.amount>0&&typeof x.date==='string'&&typeof x.category==='string'&&typeof x.id==='string'))throw Error('Movimientos no válidos');if(!confirm('Esto sustituirá todos los datos actuales. ¿Continuar?'))return;state=v;save();render();alert('Copia importada correctamente')}catch(err){alert('No se pudo importar: '+err.message)}}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
